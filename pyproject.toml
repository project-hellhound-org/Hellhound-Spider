[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hellhound-spider"
version = "14.2"
description = "Autonomous web crawler and recon engine for security testing — SPA + Non-SPA crawling, header analysis, subdomain enumeration, and intelligence classification"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Sree Danush S", email = "lazzer@gmail.com" }
]
keywords = [
    "security", "pentest", "crawler", "web-crawler", "spa", "recon",
    "reconnaissance", "bug-bounty", "ctf", "attack-surface", "endpoint-discovery",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
spa = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "patchright>=0.5.0",
]
dns = [
    "dnspython>=2.4.0",
]
full = [
    "hellhound-spider[spa,dns]",
]

[project.urls]
Homepage = "https://github.com/project-hellhound-org/hellhound-spider"
Changelog = "https://github.com/project-hellhound-org/hellhound-spider/blob/main/CHANGELOG.md"
Issues = "https://github.com/project-hellhound-org/hellhound-spider/issues"

[project.scripts]
spider = "spider:main"

[tool.setuptools]
py-modules = ["spider"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/spider.1"]